<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>冰箱台账 · Fridge Ledger</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link
        href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;700&family=IBM+Plex+Mono:wght@400;500;600&family=Inter:wght@400;500;600&display=swap"
        rel="stylesheet">
    <style>
        :root {
            --bg: #EEF3F2;
            --surface: #FFFFFF;
            --ink: #1B2B29;
            --muted: #6E827D;
            --line: #D7E2DF;
            --fresh: #3F7D5C;
            --fresh-bg: #E4F0E9;
            --warn: #C97A2E;
            --warn-bg: #FBEBD9;
            --danger: #BD4438;
            --danger-bg: #FBE2DE;
        }

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            background: var(--bg);
            color: var(--ink);
            font-family: 'Inter', sans-serif;
            min-height: 100vh;
        }

        .wrap {
            max-width: 780px;
            margin: 0 auto;
            padding: 48px 24px 80px;
        }

        header {
            display: flex;
            justify-content: space-between;
            align-items: flex-end;
            border-bottom: 2px solid var(--ink);
            padding-bottom: 16px;
            margin-bottom: 8px;
        }

        h1 {
            font-family: 'Space Grotesk', sans-serif;
            font-weight: 700;
            font-size: 30px;
            letter-spacing: -0.02em;
            margin: 0;
        }

        h1 span {
            color: var(--fresh);
        }

        .subtitle {
            font-family: 'IBM Plex Mono', monospace;
            font-size: 12px;
            color: var(--muted);
            margin-top: 4px;
        }

        .stamp {
            font-family: 'IBM Plex Mono', monospace;
            font-size: 12px;
            color: var(--muted);
            text-align: right;
        }

        .stamp b {
            color: var(--ink);
            font-size: 20px;
            display: block;
            font-weight: 600;
        }

        form {
            background: var(--surface);
            border: 1px solid var(--line);
            border-radius: 14px;
            padding: 20px;
            margin: 28px 0 36px;
            display: grid;
            grid-template-columns: 2fr 1fr 1fr auto;
            gap: 12px;
            align-items: end;
        }

        .field {
            display: flex;
            flex-direction: column;
            gap: 6px;
        }

        label {
            font-size: 11px;
            text-transform: uppercase;
            letter-spacing: 0.06em;
            color: var(--muted);
            font-weight: 500;
        }

        input,
        select {
            font-family: 'Inter', sans-serif;
            font-size: 14px;
            padding: 10px 12px;
            border: 1px solid var(--line);
            border-radius: 8px;
            background: var(--bg);
            color: var(--ink);
        }

        input:focus,
        select:focus,
        button:focus {
            outline: 2px solid var(--fresh);
            outline-offset: 1px;
        }

        button {
            font-family: 'Space Grotesk', sans-serif;
            font-weight: 700;
            font-size: 14px;
            background: var(--ink);
            color: var(--bg);
            border: none;
            border-radius: 8px;
            padding: 11px 20px;
            cursor: pointer;
            transition: transform 0.12s ease, background 0.12s ease;
        }

        button:hover {
            background: var(--fresh);
        }

        button:active {
            transform: scale(0.97);
        }

        .section-label {
            font-family: 'IBM Plex Mono', monospace;
            font-size: 11px;
            text-transform: uppercase;
            letter-spacing: 0.08em;
            color: var(--muted);
            margin: 0 0 12px 2px;
            display: flex;
            justify-content: space-between;
        }

        .list {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .item {
            background: var(--surface);
            border: 1px solid var(--line);
            border-left: 6px solid var(--fresh);
            border-radius: 10px;
            padding: 14px 16px;
            display: grid;
            grid-template-columns: 1fr auto auto;
            align-items: center;
            gap: 16px;
            animation: rise 0.25s ease;
        }

        @keyframes rise {
            from {
                opacity: 0;
                transform: translateY(6px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .item.warn {
            border-left-color: var(--warn);
        }

        .item.danger {
            border-left-color: var(--danger);
        }

        .item-name {
            font-weight: 600;
            font-size: 15px;
        }

        .item-meta {
            font-family: 'IBM Plex Mono', monospace;
            font-size: 11px;
            color: var(--muted);
            margin-top: 2px;
        }

        .badge {
            font-family: 'IBM Plex Mono', monospace;
            font-size: 12px;
            font-weight: 600;
            padding: 6px 10px;
            border-radius: 6px;
            white-space: nowrap;
            background: var(--fresh-bg);
            color: var(--fresh);
        }

        .item.warn .badge {
            background: var(--warn-bg);
            color: var(--warn);
        }

        .item.danger .badge {
            background: var(--danger-bg);
            color: var(--danger);
        }

        .del {
            background: none;
            border: none;
            color: var(--muted);
            font-size: 18px;
            cursor: pointer;
            padding: 4px 8px;
            line-height: 1;
        }

        .del:hover {
            color: var(--danger);
        }

        .empty {
            text-align: center;
            padding: 60px 20px;
            color: var(--muted);
            border: 1px dashed var(--line);
            border-radius: 14px;
            font-family: 'IBM Plex Mono', monospace;
            font-size: 13px;
        }

        .empty b {
            display: block;
            font-family: 'Space Grotesk', sans-serif;
            font-size: 17px;
            color: var(--ink);
            margin-bottom: 6px;
        }

        @media (max-width: 640px) {
            form {
                grid-template-columns: 1fr 1fr;
            }

            form button {
                grid-column: 1 / -1;
            }

            .item {
                grid-template-columns: 1fr auto;
            }

            .del {
                grid-column: 1 / -1;
                justify-self: end;
                margin-top: -6px;
            }
        }
    </style>
</head>

<body>
    <div class="wrap">
        <header>
            <div>
                <h1>冰箱<span>台账</span></h1>
                <div class="subtitle">FRIDGE LEDGER — 记录每一样食材的保鲜倒计时</div>
            </div>
            <div class="stamp">今日<b id="todayStamp"></b></div>
        </header>

        <form id="addForm">
            <div class="field" style="grid-column: 1 / 2;">
                <label for="name">食材名称</label>
                <input list="presets" id="name" placeholder="例如：牛奶" required>
                <datalist id="presets"></datalist>
            </div>
            <div class="field">
                <label for="purchaseDate">购买日期</label>
                <input type="date" id="purchaseDate" required>
            </div>
            <div class="field">
                <label for="shelfLife">保质天数</label>
                <input type="number" id="shelfLife" min="0" placeholder="7" required>
            </div>
            <button type="submit">添加</button>
        </form>

        <div class="section-label">
            <span id="listLabel">冰箱里的食材</span>
            <span id="listCount"></span>
        </div>

        <div class="list" id="list"></div>
    </div>

    <script>
        const PRESETS = {
            "牛奶": 7, "鸡蛋": 21, "酸奶": 14, "生鸡肉": 2, "生猪肉": 3,
            "生牛肉": 3, "叶菜": 4, "根茎类蔬菜": 14, "豆腐": 5, "剩菜": 3,
            "面包": 5, "水果": 6, "芝士": 21, "黄油": 30
        };

        const presetList = document.getElementById('presets');
        Object.keys(PRESETS).forEach(name => {
            const opt = document.createElement('option');
            opt.value = name;
            presetList.appendChild(opt);
        });

        const nameInput = document.getElementById('name');
        const shelfInput = document.getElementById('shelfLife');
        nameInput.addEventListener('input', () => {
            if (PRESETS[nameInput.value] && !shelfInput.value) {
                shelfInput.value = PRESETS[nameInput.value];
            }
        });

        const dateInput = document.getElementById('purchaseDate');
        const todayISO = new Date().toISOString().slice(0, 10);
        dateInput.value = todayISO;
        document.getElementById('todayStamp').textContent =
            new Date().toLocaleDateString('zh-CN', { month: '2-digit', day: '2-digit' });

        const STORAGE_KEY = 'fridge-ledger-items';

        function loadItems() {
            try {
                const raw = localStorage.getItem(STORAGE_KEY);
                return raw ? JSON.parse(raw) : [];
            } catch (e) {
                return [];
            }
        }

        function saveItems(items) {
            localStorage.setItem(STORAGE_KEY, JSON.stringify(items));
        }

        function daysRemaining(purchaseDate, shelfLife) {
            const purchase = new Date(purchaseDate + 'T00:00:00');
            const expiry = new Date(purchase.getTime() + shelfLife * 86400000);
            const today = new Date(todayISO + 'T00:00:00');
            return Math.round((expiry - today) / 86400000);
        }

        function statusOf(days) {
            if (days <= 0) return 'danger';
            if (days <= 2) return 'warn';
            return 'ok';
        }

        function labelOf(days) {
            if (days < 0) return `已过期 ${Math.abs(days)} 天`;
            if (days === 0) return '今天到期';
            return `剩 ${days} 天`;
        }

        function render() {
            const items = loadItems();
            const list = document.getElementById('list');
            const countEl = document.getElementById('listCount');
            list.innerHTML = '';

            if (items.length === 0) {
                list.innerHTML = `<div class="empty"><b>冰箱是空的</b>在上面添加第一样食材，开始记录保鲜期吧</div>`;
                countEl.textContent = '';
                return;
            }

            const withDays = items.map(it => ({
                ...it,
                days: daysRemaining(it.purchaseDate, it.shelfLife)
            })).sort((a, b) => a.days - b.days);

            countEl.textContent = `共 ${items.length} 项`;

            withDays.forEach(it => {
                const status = statusOf(it.days);
                const div = document.createElement('div');
                div.className = 'item' + (status === 'ok' ? '' : ' ' + status);
                div.innerHTML = `
        <div>
          <div class="item-name">${escapeHtml(it.name)}</div>
          <div class="item-meta">购于 ${it.purchaseDate} · 保质 ${it.shelfLife} 天</div>
        </div>
        <div class="badge">${labelOf(it.days)}</div>
        <button class="del" title="删除" data-id="${it.id}">✕</button>
      `;
                list.appendChild(div);
            });

            list.querySelectorAll('.del').forEach(btn => {
                btn.addEventListener('click', () => {
                    const id = btn.getAttribute('data-id');
                    const next = loadItems().filter(it => String(it.id) !== id);
                    saveItems(next);
                    render();
                });
            });
        }

        function escapeHtml(str) {
            const div = document.createElement('div');
            div.textContent = str;
            return div.innerHTML;
        }

        document.getElementById('addForm').addEventListener('submit', (e) => {
            e.preventDefault();
            const name = nameInput.value.trim();
            const purchaseDate = dateInput.value;
            const shelfLife = parseInt(shelfInput.value, 10);
            if (!name || !purchaseDate || isNaN(shelfLife)) return;

            const items = loadItems();
            items.push({ id: Date.now(), name, purchaseDate, shelfLife });
            saveItems(items);

            nameInput.value = '';
            shelfInput.value = '';
            dateInput.value = todayISO;
            nameInput.focus();
            render();
        });

        render();
    </script>
</body>

</html>
